# Preview for review (plan.md § 3, ADR 0003): builds /digest/2026-10-28 as one HTML file and
# deploys it to this repo's GitHub Pages. The file is never committed to any branch.
# The banner carries the repo secret LANE_MARKER; delete the secret and run again to take the
# marker off (§ 4). Take the site down: gh api -X DELETE repos/<owner>/<repo>/pages
name: preview
on:
  workflow_dispatch:
    inputs:
      page:
        description: rig path to save
        default: /digest/2026-10-28
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 12.16.1
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Save the page
        env:
          LANE_MARKER: ${{ secrets.LANE_MARKER }}
          PAGE: ${{ inputs.page }}
        run: pnpm save-page "$PAGE" _site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site/
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
